[project]
name = "masklens"
version = "0.1.1"
description = "Preflight check for SFT loss masks: verify which tokens a chat template, tokenizer and labels will actually train on, before you spend GPU time."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "LeeGyeongPil" }]
keywords = ["sft", "fine-tuning", "chat-template", "loss-mask", "transformers", "lora"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
]
dependencies = [
  "transformers>=5.24.0,<6",
  "jinja2>=3.1.6",
]

[project.scripts]
masklens = "masklens.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masklens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
