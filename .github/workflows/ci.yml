# Tests run offline against the tiny tokenizer shipped in the repo (no model downloads).
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catch dependency drift
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv python install
      - run: uv sync --locked
      - run: uv run pytest -q
        env:
          HF_HUB_OFFLINE: "1"
