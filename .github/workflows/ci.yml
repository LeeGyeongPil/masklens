# Tests run offline against the tiny tokenizer shipped in the repo (no model downloads).
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catch dependency drift
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      HF_HUB_OFFLINE: "1"          # never reach the Hugging Face Hub
      UV_PYTHON_DOWNLOADS: never   # use the interpreter from setup-python
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Show runner environment
        run: |
          python --version
          uname -a
          df -h . | tail -1
          git ls-files | wc -l
      - run: python -m pip install "uv==0.13.6"
      - run: uv sync --locked --python ${{ matrix.python }}
      # -rA -v: print every test outcome so a failing run shows its cause in the log
      - run: uv run --locked --python ${{ matrix.python }} pytest -rA -v --tb=long
      - run: uv build
      - name: Installed packages (on failure)
        if: failure()
        run: uv pip list || true
