# Tests run offline against the tiny tokenizer shipped in the repo (no model downloads).
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catch dependency drift
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      HF_HUB_OFFLINE: "1"          # never reach the Hugging Face Hub
      UV_PYTHON_DOWNLOADS: never   # use the interpreter from setup-python
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "uv==0.13.6"
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked --python ${{ matrix.python }} pytest -q
      - run: uv build
